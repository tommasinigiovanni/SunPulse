<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sunpulse-logo.png" />
    <link rel="apple-touch-icon" href="/sunpulse-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SunPulse - Dashboard per monitoraggio impianti fotovoltaici" />
    <meta name="theme-color" content="#1890ff" />
    <title>SunPulse</title>
    
    <!-- Google Maps JavaScript API - caricato dal React app -->
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f5a623 0%, #1890ff 50%, #0d4a8c 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
        border-radius: 50%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      
      .loading-title {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #fff, #ffd700);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .loading-subtitle {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 24px;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      
      .app-loaded #loading-screen {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Questa applicazione richiede JavaScript per funzionare.</p>
      </div>
    </noscript>
    
    <div id="loading-screen">
      <img src="/sunpulse-logo.png" alt="SunPulse" class="loading-logo" />
      <h2 class="loading-title">SunPulse</h2>
      <p class="loading-subtitle">Solar PV Monitoring & ZCS Azzurro Integration</p>
      <div class="loading-spinner"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      window.addEventListener('load', function() {
        setTimeout(() => document.body.classList.add('app-loaded'), 800);
      });
    </script>
  </body>
</html>
